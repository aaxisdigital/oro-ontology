services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    # Shared TypeScript build pipeline (classes live in AaxisCommonBundle).
    aaxis_ontology.typescript_compiler:
        class: Aaxis\Bundle\CommonBundle\Build\TypeScriptCompiler
        arguments:
            - '%kernel.project_dir%'
            - '@logger'
            - '%aaxis_ontology.bundle_dir%/Resources/js-src/tsconfig.json'
            - 'AaxisOntologyBundle'

    aaxis_ontology.typescript_compile_command:
        class: Aaxis\Bundle\CommonBundle\Command\CompileTypeScriptCommand
        arguments:
            - '@aaxis_ontology.typescript_compiler'
            - 'aaxis:ontology:typescript:compile'
        tags:
            - { name: console.command, command: 'aaxis:ontology:typescript:compile' }

    aaxis_ontology.compile_typescript_on_assets_build_listener:
        class: Aaxis\Bundle\CommonBundle\EventListener\CompileTypeScriptOnAssetsBuildListener
        arguments:
            - '@aaxis_ontology.typescript_compiler'
        tags:
            - { name: kernel.event_subscriber }

    # Syncs entity attribute definitions with written data and enforces the attribute contract.
    Aaxis\Bundle\OntologyBundle\Manager\OntologyAttributeReconciler:
        arguments:
            - '@doctrine'

    # Reusable Data API core (read / upsert / query), shared by the HTTP API controller and any
    # other PHP code that needs the same operations.
    Aaxis\Bundle\OntologyBundle\Dwl\DwlTransformer: ~

    # Reads/writes files through the file-based connectors (file_system, sftp, bucket) for the
    # flow reader/writer steps.
    Aaxis\Bundle\OntologyBundle\Manager\FileConnectorTransfer:
        arguments:
            - '@Aaxis\Bundle\OntologyBundle\Manager\S3RequestSigner'
            - '@http_client'

    # The Logger STEP's own monolog channel, wired manually so its lines always reach the
    # environment's log file: Oro's LoggerBundle keeps the default handlers at ERROR unless the
    # temporary "detailed logs" level is raised, which would silently swallow flow log lines.
    aaxis_ontology.flow_logger.handler:
        class: Monolog\Handler\StreamHandler
        arguments:
            - '%kernel.logs_dir%/%kernel.environment%.log'
            - 'info'

    aaxis_ontology.flow_logger:
        class: Monolog\Logger
        arguments:
            - 'aaxis_flow'
            - ['@aaxis_ontology.flow_logger.handler']

    Aaxis\Bundle\OntologyBundle\Manager\FlowDebugExecutor:
        arguments:
            - '@Aaxis\Bundle\OntologyBundle\Manager\OntologyDataApiManager'
            - '@doctrine'
            - '@http_client'
            - '@Aaxis\Bundle\OntologyBundle\Dwl\DwlTransformer'
            - '@Aaxis\Bundle\OntologyBundle\Manager\FileConnectorTransfer'
            - '@Aaxis\Bundle\OntologyBundle\Manager\FlowStepValidator'
            - '@Aaxis\Bundle\OntologyBundle\Manager\DatabaseQueryRunner'
            - '@aaxis_ontology.flow_logger'
            - '@Aaxis\Bundle\OntologyBundle\Manager\PhpMethodInvoker'

    # The "Invoke PHP" step's engine. The first argument is a placeholder: InvokableServicesPass
    # replaces it with a class-keyed service locator over EVERY container service; the System
    # Configuration setting aaxis_ontology.invoke_php_namespaces decides at runtime which of
    # those classes flows may actually call.
    Aaxis\Bundle\OntologyBundle\Manager\PhpMethodInvoker:
        public: true
        arguments:
            - ~
            - '@Aaxis\Bundle\OntologyBundle\Dwl\DwlTransformer'
            - '@oro_config.global'

    # The rules a flow's steps must clear to be stored — shared by the editor's save endpoint and
    # the importer, so an imported flow is exactly as valid as a hand-built one.
    Aaxis\Bundle\OntologyBundle\Manager\FlowStepValidator:
        arguments:
            - '@Aaxis\Bundle\OntologyBundle\Dwl\DwlTransformer'
            - '@translator'

    # Moves flows between environments as JSON (connector ids <-> name/type descriptors).
    Aaxis\Bundle\OntologyBundle\Manager\FlowPortability:
        arguments:
            - '@doctrine'
            - '@translator'
            - '@Aaxis\Bundle\OntologyBundle\Manager\FlowStepValidator'

    # The minutely flow scheduler (see Command/RunScheduledFlowsCommand).
    Aaxis\Bundle\OntologyBundle\Manager\ScheduledFlowRunner:
        public: true
        arguments:
            - '@doctrine'
            - '@Aaxis\Bundle\OntologyBundle\Manager\FlowDebugExecutor'
            - '@logger'

    # Resolves + runs the flow whose Endpoint trigger matches an incoming API request
    # (the /api/aaxis/ontology/flow/... catch-all in Api/OntologyFlowApiController).
    Aaxis\Bundle\OntologyBundle\Manager\EndpointFlowRunner:
        public: true
        arguments:
            - '@doctrine'
            - '@Aaxis\Bundle\OntologyBundle\Manager\FlowDebugExecutor'
            - '@Aaxis\Bundle\OntologyBundle\Dwl\DwlTransformer'

    Aaxis\Bundle\OntologyBundle\Command\RunScheduledFlowsCommand:
        arguments:
            - '@Aaxis\Bundle\OntologyBundle\Manager\ScheduledFlowRunner'
        tags:
            - { name: console.command, command: 'aaxis:ontology:flows:run-due' }

    Aaxis\Bundle\OntologyBundle\Manager\OntologyDataApiManager:
        public: true
        arguments:
            - '@doctrine'
            - '@oro_message_queue.client.message_producer'
            - '@oro_config.global'
            - '@Aaxis\Bundle\OntologyBundle\Manager\OntologyAttributeReconciler'
            - '@Aaxis\Bundle\OntologyBundle\Manager\OntologyDataEventRecorder'
            - '@Aaxis\Bundle\OntologyBundle\Manager\OroEntityReader'
            - '@Aaxis\Bundle\OntologyBundle\Manager\OroEntityWriter'

    # Reads internal-system entities from the OroCommerce entity itself (their data never lives in
    # aaxis_ontology_data): payload = configured attributes, or every scalar column when none.
    Aaxis\Bundle\OntologyBundle\Manager\OroEntityReader:
        arguments:
            - '@doctrine'

    # The write-side counterpart: UPDATES the Oro rows behind an internal-system entity (existing
    # records only; field set shared with the reader so payloads round-trip).
    Aaxis\Bundle\OntologyBundle\Manager\OroEntityWriter:
        arguments:
            - '@doctrine'
            - '@Aaxis\Bundle\OntologyBundle\Manager\OroEntityReader'

    # The single writer of aaxis_ontology_data_events, shared by the synchronous upsert path and
    # the async consumer so their event rows can never drift apart.
    Aaxis\Bundle\OntologyBundle\Manager\OntologyDataEventRecorder:
        arguments:
            - '@doctrine'

    # Masks/restores secret values inside connector JSON configs (form + view page).
    Aaxis\Bundle\OntologyBundle\Manager\ConnectorConfigSecrets: ~

    # Signs S3-compatible object storage requests (AWS SigV4) for bucket connectors.
    Aaxis\Bundle\OntologyBundle\Manager\S3RequestSigner: ~

    # Executes the "SQL Query" flow step against database connectors (PostgreSQL, PDO).
    Aaxis\Bundle\OntologyBundle\Manager\DatabaseQueryRunner: ~

    # Runs the Configure popup's "Test" checks (path / socket / SFTP auth / OAuth call / bucket list).
    Aaxis\Bundle\OntologyBundle\Manager\ConnectorTester:
        arguments:
            - '@Aaxis\Bundle\OntologyBundle\Manager\S3RequestSigner'

    # Renders a DWL result per the script's `output <mime>` directive (DWL playground).
    Aaxis\Bundle\OntologyBundle\Manager\DwlOutputFormatter: ~

    # Screens playground scripts for environment introspection (dw::Runtime::props).
    Aaxis\Bundle\OntologyBundle\Manager\DwlScriptGuard: ~

    # Connector CRUD form type
    Aaxis\Bundle\OntologyBundle\Form\Type\OntologyConnectorType:
        arguments:
            - '@Aaxis\Bundle\OntologyBundle\Manager\ConnectorConfigSecrets'
        tags:
            - { name: form.type }

    # Message queue: data upsert
    Aaxis\Bundle\OntologyBundle\Async\Topic\OntologyDataUpsertTopic:
        tags:
            - { name: oro_message_queue.topic }

    Aaxis\Bundle\OntologyBundle\Async\OntologyDataUpsertProcessor:
        arguments:
            - '@doctrine'
            - '@logger'
            - '@Aaxis\Bundle\OntologyBundle\Manager\OntologyDataEventRecorder'
        tags:
            - { name: oro_message_queue.client.message_processor }
