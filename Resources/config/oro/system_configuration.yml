                required: false

    tree:
        system_configuration:
            aaxis:
                children:
                    aaxis_general:
                        children:
                            aaxis_ontology:
                                priority: 90
                                children:
                                    aaxis_ontology_general:
                                        priority: 100
                                        children:
                                            - aaxis_ontology.enabled
                                    aaxis_ontology_flows:
                                        priority: 90
                                        children:
                                            - aaxis_ontology.flow_editor_grid_spacing
                                            - aaxis_ontology.flow_editor_step_size_factor
                                            - aaxis_ontology.invoke_php_namespaces
                                    aaxis_ontology_api:
                                        priority: 80
                                        children:
                                            - aaxis_ontology.api_read_enabled
                                            - aaxis_ontology.api_upsert_enabled
                                            - aaxis_ontology.api_query_enabled
                                            - aaxis_ontology.api_auto_create
                                            - aaxis_ontology.api_auto_create_unique_attribute
                                            - aaxis_ontology.api_query_max_page_size
                                    aaxis_ontology_flow_api:
                                        priority: 70
                                        children:
                                            - aaxis_ontology.flow_api_secure_enabled
                                            - aaxis_ontology.flow_api_public_enabled
                                    aaxis_ontology_flow_elements:
                                        priority: 60
                                        children:
                                            - aaxis_ontology.flow_element_cron
                                            - aaxis_ontology.flow_element_endpoint
                                            - aaxis_ontology.flow_element_entity_change
                                            - aaxis_ontology.flow_element_subflow
                                            - aaxis_ontology.flow_element_choice
                                            - aaxis_ontology.flow_element_sub_flow
                                            - aaxis_ontology.flow_element_foreach
                                            - aaxis_ontology.flow_element_dwl_transform
                                            - aaxis_ontology.flow_element_entity_read
                                            - aaxis_ontology.flow_element_entity_write
                                            - aaxis_ontology.flow_element_invoke
                                            - aaxis_ontology.flow_element_sql_query
                                            - aaxis_ontology.flow_element_invoke_php
                                            - aaxis_ontology.flow_element_file_read
                                            - aaxis_ontology.flow_element_file_write
                                            - aaxis_ontology.flow_element_file_list
                                            - aaxis_ontology.flow_element_file_delete
                                            - aaxis_ontology.flow_element_file_rename
                                            - aaxis_ontology.flow_element_logger
                                            - aaxis_ontology.flow_element_event
                                            - aaxis_ontology.flow_element_email
                                            - aaxis_ontology.flow_element_ms_teams
