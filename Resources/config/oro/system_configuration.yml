            options:
                label: aaxis.ontology.config.flow_elements.sub_flow.label
                required: false
        aaxis_ontology.flow_element_foreach:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
