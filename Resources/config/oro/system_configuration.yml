            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.flow_elements.event.label
                required: false
        aaxis_ontology.flow_element_email:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.flow_elements.email.label
                required: false
