            options:
                label: aaxis.ontology.config.flow_elements.entity_read.label
                required: false
        aaxis_ontology.flow_element_entity_write:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.flow_elements.entity_write.label
                required: false
        aaxis_ontology.flow_element_invoke:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
