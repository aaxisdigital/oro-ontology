system_configuration:
    groups:
        aaxis_ontology:
            title: aaxis.ontology.config.group.title
            icon: fa-database
        aaxis_ontology_general:
            title: aaxis.ontology.config.general.title
            icon: fa-cog
        aaxis_ontology_general_section:
            title: aaxis.ontology.config.general.title
        aaxis_ontology_bucket:
            title: aaxis.ontology.config.bucket.title
            icon: fa-archive
        aaxis_ontology_bucket_section:
            title: aaxis.ontology.config.bucket.title
        aaxis_ontology_flows:
            title: aaxis.ontology.config.flows.title
            icon: fa-sitemap
        aaxis_ontology_flows_section:
            title: aaxis.ontology.config.flows.title
        aaxis_ontology_api:
            title: aaxis.ontology.config.api.title
            icon: fa-exchange
        aaxis_ontology_api_section:
            title: aaxis.ontology.config.api.title
        aaxis_ontology_flow_api:
            title: aaxis.ontology.config.flow_api.title
            icon: fa-plug
        aaxis_ontology_flow_api_section:
            title: aaxis.ontology.config.flow_api.title
        aaxis_ontology_flow_elements:
            title: aaxis.ontology.config.flow_elements.title
            icon: fa-th
        aaxis_ontology_flow_elements_section:
            title: aaxis.ontology.config.flow_elements.title

    fields:
        aaxis_ontology.enabled:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.enabled.label
                required: false

        # --- Settings: retention / bucket archiving (config only — logic to come) ---
        aaxis_ontology.bucket_base_path:
            data_type: string
            type: Symfony\Component\Form\Extension\Core\Type\TextType
            options:
                label: aaxis.ontology.config.bucket.base_path.label
                tooltip: aaxis.ontology.config.bucket.base_path.tooltip
                required: false
        aaxis_ontology.flow_execution_history_days:
            data_type: integer
            type: Symfony\Component\Form\Extension\Core\Type\IntegerType
            options:
                label: aaxis.ontology.config.general.flow_execution_history_days.label
                tooltip: aaxis.ontology.config.general.flow_execution_history_days.tooltip
                required: false
        aaxis_ontology.flow_version_history_days:
            data_type: integer
            type: Symfony\Component\Form\Extension\Core\Type\IntegerType
            options:
                label: aaxis.ontology.config.general.flow_version_history_days.label
                tooltip: aaxis.ontology.config.general.flow_version_history_days.tooltip
                required: false
        aaxis_ontology.entity_version_history_days:
            data_type: integer
            type: Symfony\Component\Form\Extension\Core\Type\IntegerType
            options:
                label: aaxis.ontology.config.general.entity_version_history_days.label
                tooltip: aaxis.ontology.config.general.entity_version_history_days.tooltip
                required: false
        aaxis_ontology.db_usage:
            ui_only: true
            data_type: string
            type: Aaxis\Bundle\OntologyBundle\Form\Type\DbUsageType
            options:
                label: aaxis.ontology.config.general.db_usage.label
                tooltip: aaxis.ontology.config.general.db_usage.tooltip
                required: false
                # informational widget — no "Use Default" wrapper
                resettable: false

        # --- Bucket (S3-compatible object storage the archive features write to) ---
        aaxis_ontology.use_bucket_for_entity_data:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.bucket.use_bucket_for_entity_data.label
                tooltip: aaxis.ontology.config.bucket.use_bucket_for_entity_data.tooltip
                required: false
        aaxis_ontology.use_bucket_for_flow_events:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.bucket.use_bucket_for_flow_events.label
                tooltip: aaxis.ontology.config.bucket.use_bucket_for_flow_events.tooltip
                required: false
        aaxis_ontology.bucket_endpoint_url:
            data_type: string
            type: Symfony\Component\Form\Extension\Core\Type\TextType
            options:
                label: aaxis.ontology.config.bucket.endpoint_url.label
                tooltip: aaxis.ontology.config.bucket.endpoint_url.tooltip
                required: false
        aaxis_ontology.bucket_access_key:
            data_type: string
            type: Oro\Bundle\FormBundle\Form\Type\OroEncodedPlaceholderPasswordType
            options:
                label: aaxis.ontology.config.bucket.access_key.label
                resettable: true
                required: false
        aaxis_ontology.bucket_secret_key:
            data_type: string
            type: Oro\Bundle\FormBundle\Form\Type\OroEncodedPlaceholderPasswordType
            options:
                label: aaxis.ontology.config.bucket.secret_key.label
                resettable: true
                required: false
        aaxis_ontology.bucket_name:
            data_type: string
            type: Symfony\Component\Form\Extension\Core\Type\TextType
            options:
                label: aaxis.ontology.config.bucket.bucket_name.label
                tooltip: aaxis.ontology.config.bucket.bucket_name.tooltip
                required: false
        aaxis_ontology.bucket_test:
            ui_only: true
            data_type: string
            type: Aaxis\Bundle\OntologyBundle\Form\Type\BucketTestType
            options:
                label: aaxis.ontology.config.bucket.test.label
                tooltip: aaxis.ontology.config.bucket.test.tooltip
                required: false
                # just the button — no "Use Default" wrapper (checked, it disabled the button)
                resettable: false

        # --- Flows ---
        aaxis_ontology.flow_editor_grid_spacing:
            data_type: integer
            type: Symfony\Component\Form\Extension\Core\Type\IntegerType
            options:
                label: aaxis.ontology.config.flows.editor_grid_spacing.label
                tooltip: aaxis.ontology.config.flows.editor_grid_spacing.tooltip
                required: false
        aaxis_ontology.flow_editor_step_size_factor:
            data_type: integer
            type: Symfony\Component\Form\Extension\Core\Type\IntegerType
            options:
                label: aaxis.ontology.config.flows.editor_step_size_factor.label
                tooltip: aaxis.ontology.config.flows.editor_step_size_factor.tooltip
                required: false

        aaxis_ontology.flow_debug_autoclose_seconds:
            data_type: integer
            type: Symfony\Component\Form\Extension\Core\Type\IntegerType
            options:
                label: aaxis.ontology.config.flows.debug_autoclose.label
                tooltip: aaxis.ontology.config.flows.debug_autoclose.tooltip
                required: false

        aaxis_ontology.flow_debug_timeout_minutes:
            data_type: integer
            type: Symfony\Component\Form\Extension\Core\Type\IntegerType
            options:
                label: aaxis.ontology.config.flows.debug_timeout.label
                tooltip: aaxis.ontology.config.flows.debug_timeout.tooltip
                required: false

        aaxis_ontology.invoke_php_namespaces:
            data_type: string
            type: Symfony\Component\Form\Extension\Core\Type\TextareaType
            options:
                label: aaxis.ontology.config.flows.invoke_php_namespaces.label
                tooltip: aaxis.ontology.config.flows.invoke_php_namespaces.tooltip
                required: false

        # --- Data HTTP API ---
        aaxis_ontology.api_read_enabled:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.api.read_enabled.label
                tooltip: aaxis.ontology.config.api.read_enabled.tooltip
                required: false
        aaxis_ontology.api_upsert_enabled:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.api.upsert_enabled.label
                tooltip: aaxis.ontology.config.api.upsert_enabled.tooltip
                required: false
        aaxis_ontology.api_query_enabled:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.api.query_enabled.label
                tooltip: aaxis.ontology.config.api.query_enabled.tooltip
                required: false
        aaxis_ontology.api_auto_create:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.api.auto_create.label
                tooltip: aaxis.ontology.config.api.auto_create.tooltip
                required: false
        aaxis_ontology.api_auto_create_unique_attribute:
            data_type: string
            type: Symfony\Component\Form\Extension\Core\Type\TextType
            options:
                label: aaxis.ontology.config.api.auto_create_unique_attribute.label
                tooltip: aaxis.ontology.config.api.auto_create_unique_attribute.tooltip
                required: false
        aaxis_ontology.api_query_max_page_size:
            data_type: integer
            type: Symfony\Component\Form\Extension\Core\Type\IntegerType
            options:
                label: aaxis.ontology.config.api.query_max_page_size.label
                tooltip: aaxis.ontology.config.api.query_max_page_size.tooltip
                required: false

        aaxis_ontology.flow_api_secure_enabled:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.flow_api.secure_enabled.label
                tooltip: aaxis.ontology.config.flow_api.secure_enabled.tooltip
                required: false
        aaxis_ontology.flow_api_public_enabled:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.flow_api.public_enabled.label
                tooltip: aaxis.ontology.config.flow_api.public_enabled.tooltip
                required: false
        aaxis_ontology.flow_element_cron:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.flow_elements.cron.label
                required: false
        aaxis_ontology.flow_element_endpoint:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: aaxis.ontology.config.flow_elements.endpoint.label
                required: false
        aaxis_ontology.flow_element_entity_change:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
