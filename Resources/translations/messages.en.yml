aaxis:
    ontology:
        menu:
            aaxis_ontology:
                label: Ontology
                description: Model systems, entities, connectors, flows and events
            aaxis_ontology_systems:
                label: Systems
                description: External and internal systems
            aaxis_ontology_entities:
                label: Entities
                description: Data entities and their attributes
            aaxis_ontology_connectors:
                label: Connectors
                description: Integrations between systems
            aaxis_ontology_flows:
                label: Flows
                description: Data flows across systems
            aaxis_ontology_events:
                label: Events
                description: Events that drive data changes
            aaxis_ontology_data_view:
                label: Data View
                description: Consolidated view of the data model
        feature:
            label: 'Ontology'
        config:
            group:
                title: 'Ontology'
            general:
                title: 'Settings'
                flow_execution_history_days:
                    label: 'Flow execution history days'
                    tooltip: 'How many days of flow execution events are kept.'
                flow_version_history_days:
                    label: 'Flow version history days'
                    tooltip: 'How many days archived flow versions are kept.'
                entity_version_history_days:
                    label: 'Entity version history days'
                    tooltip: 'How many days entity data record versions are kept.'
                db_usage:
                    label: 'DB Usage'
                    col_table: 'Table'
                    col_size: 'Size on disk'
                    tooltip: 'Current on-disk size (table + indexes) of the ontology data and history tables — information only, to support the retention choices above.'
            bucket:
                title: 'Bucket'
                use_bucket_for_entity_data:
                    label: 'Use Bucket for Entity Data'
                    tooltip: 'When enabled, entity data record content is stored in the configured bucket. Requires working connectivity to the bucket.'
                use_bucket_for_flow_events:
                    label: 'Use Bucket for Flow Events'
                    tooltip: 'When enabled, flow execution events are stored in and shown from the configured bucket ({base path}/flow-events/{yyyy}/{mm}/{dd}/{flow id}-{run uuid}/...). Requires working connectivity to the bucket.'
                endpoint_url:
                    label: 'Endpoint URL'
                    tooltip: 'S3-compatible endpoint URL, e.g. http://minio:9000 or https://<namespace>.compat.objectstorage.<region>.oraclecloud.com (as reachable from the application container; the port defaults from the scheme).'
                access_key:
                    label: 'Access key'
                secret_key:
                    label: 'Secret key'
                bucket_name:
                    label: 'Bucket name'
                    tooltip: 'Name of the bucket (what Cyberduck calls "Path").'
                base_path:
                    label: 'Bucket base path'
                    tooltip: 'Base path (key prefix) inside the bucket under which ontology data is stored.'
                test:
                    label: 'Connectivity'
                    tooltip: 'Probes the values currently in the form (unsaved edits included): a TCP socket to the server, then a signed one-object listing of the bucket — the same checks as a bucket connector''s Test.'
                    button: 'Test connection'
            enabled:
                label: Enabled
            flows:
                debug_timeout:
                    label: 'Debugger inactivity timeout (minutes)'
                    tooltip: 'A stepwise debug session idle longer than this is terminated: the run is closed with a flow-exception event carrying "debug-timeout", and further stepping is refused. 0 disables the timeout.'
                debug_autoclose:
                    label: 'Debugger auto-close (seconds)'
                    tooltip: 'A FINISHED debug pane dismisses itself after this many seconds, with a countdown bar under the buttons. 0 keeps it open until closed manually.'
                invoke_php_namespaces:
                    label: 'Invoke PHP: allowed class prefixes'
                    tooltip: 'Namespace prefixes (one per line) whose container services the "Invoke PHP" flow step may call — e.g. Aaxis\ or Edge\ or a specific Oro\Bundle\SomeBundle\ one.'
                title: 'Flows'
                editor_grid_spacing:
                    label: 'Editor grid spacing (px)'
                    tooltip: 'Spacing, in pixels, between the dots of the flow editor canvas background (default 10).'
                editor_step_size_factor:
                    label: 'Editor step size (grid multiples)'
                    tooltip: 'Side of a step tile on the flow editor canvas, as a multiple of the grid spacing (default 8 — e.g. 80px tiles on a 10px grid).'
            flow_api:
                title: 'Flow API'
                secure_enabled:
                    label: 'Enable Secure API Endpoints'
                    tooltip: 'When disabled, Endpoint triggers that REQUIRE authentication are not served — calls to them return 404.'
                public_enabled:
                    label: 'Enable Public API Endpoints'
                    tooltip: 'When disabled, PUBLIC Endpoint triggers are not served — calls to them return 404.'
            flow_elements:
                title: 'Flow Elements'
                cron:
                    label: 'Triggers: Schedule'
                endpoint:
                    label: 'Triggers: Endpoint'
                entity_change:
                    label: 'Triggers: Entity change'
                subflow:
                    label: 'Triggers: Subflow'
                choice:
                    label: 'Flow Control: Choice'
                sub_flow:
                    label: 'Flow Control: Call Subflow'
                foreach:
                    label: 'Flow Control: Foreach Loop'
                dwl_transform:
                    label: 'Operations: DWL transform'
                entity_read:
                    label: 'Operations: Entity Read'
                entity_write:
                    label: 'Operations: Entity Write'
                invoke:
                    label: 'Operations: HTTP Request'
                sql_query:
                    label: 'Operations: SQL Query'
                invoke_php:
                    label: 'Operations: Invoke PHP'
                file_read:
                    label: 'File Operations: Read File'
                file_write:
                    label: 'File Operations: Write File'
                file_list:
                    label: 'File Operations: List Folder'
                file_delete:
                    label: 'File Operations: Delete'
                file_rename:
                    label: 'File Operations: Rename'
                logger:
                    label: 'Notification: Logger'
                event:
                    label: 'Notification: Event'
                email:
                    label: 'Notification: Email'
                ms_teams:
                    label: 'Notification: MS Teams'
            api:
                title: 'Data API'
                read_enabled:
                    label: 'Enable Read endpoint'
                    tooltip: 'Allow GET requests to read a single record by system, entity and unique id.'
                upsert_enabled:
                    label: 'Enable Upsert endpoint'
                    tooltip: 'Allow POST requests to queue an upsert for a record by system, entity and unique id.'
                query_enabled:
                    label: 'Enable Query endpoint'
                    tooltip: 'Allow POST requests to query records of a system/entity by payload attributes.'
                auto_create:
                    label: 'Auto-create unknown system/entity on upsert'
                    tooltip: 'When enabled, an upsert for an unknown system and/or entity creates them automatically. Read and query always require an existing system/entity.'
                auto_create_unique_attribute:
                    label: 'Auto-create default unique attribute'
                    tooltip: 'The unique attribute assigned to entities created automatically by the API.'
                query_max_page_size:
                    label: 'Query maximum page size'
                    tooltip: 'Hard upper bound for the query endpoint page_size parameter.'
        acl:
            category:
                label: 'Aaxis Ontology'
            api_access_all:
                label: 'Data API: full access (read, upsert, query)'
                description: 'Access all Ontology Data API endpoints, including upsert.'
            api_access_read:
                label: 'Data API: read access (read, query)'
                description: 'Access the read and query Ontology Data API endpoints (no upsert).'
            api_access_flow:
                label: 'Flow API: invoke authenticated endpoints'
                description: 'Invoke flow Endpoint triggers that require authentication (public endpoints need no permission).'
