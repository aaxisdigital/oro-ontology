aaxis:
    ontology:
        menu:
            aaxis_ontology:
                label: Ontology
                description: Model systems, entities, connectors, flows and events
            aaxis_ontology_systems:
                label: Systems
                description: External and internal systems
            aaxis_ontology_entities:
                label: Entities
                description: Data entities and their attributes
            aaxis_ontology_connectors:
                label: Connectors
                description: Integrations between systems
            aaxis_ontology_flows:
                label: Flows
                description: Data flows across systems
            aaxis_ontology_events:
                label: Events
                description: Events that drive data changes
            aaxis_ontology_data_view:
                label: Data View
                description: Consolidated view of the data model
        feature:
            label: 'Ontology'
        config:
            group:
                title: 'Aaxis Ontology'
            general:
                title: 'Settings'
            enabled:
                label: Enabled
            api:
                title: 'Data API'
                read_enabled:
                    label: 'Enable Read endpoint'
                    tooltip: 'Allow GET requests to read a single record by system, entity and unique id.'
                upsert_enabled:
                    label: 'Enable Upsert endpoint'
                    tooltip: 'Allow POST requests to queue an upsert for a record by system, entity and unique id.'
                query_enabled:
                    label: 'Enable Query endpoint'
                    tooltip: 'Allow POST requests to query records of a system/entity by payload attributes.'
                auto_create:
                    label: 'Auto-create unknown system/entity on upsert'
                    tooltip: 'When enabled, an upsert for an unknown system and/or entity creates them automatically. Read and query always require an existing system/entity.'
                auto_create_unique_attribute:
                    label: 'Auto-create default unique attribute'
                    tooltip: 'The unique attribute assigned to entities created automatically by the API.'
                query_max_page_size:
                    label: 'Query maximum page size'
                    tooltip: 'Hard upper bound for the query endpoint page_size parameter.'
        acl:
            category:
                label: 'Aaxis Ontology'
            api_access_all:
                label: 'Data API: full access (read, upsert, query)'
                description: 'Access all Ontology Data API endpoints, including upsert.'
            api_access_read:
                label: 'Data API: read access (read, query)'
                description: 'Access the read and query Ontology Data API endpoints (no upsert).'
